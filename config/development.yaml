package_version: '3.0'
mode: offline
paid_execution_enabled: false
external_sequence_upload_enabled: false
public_write_demo_enabled: false
meta:
  base_url: null
  api_key_env: MODEL_API_KEY
  model: null
  data_mode: standard
  surface: chat_completions
  developer_prompt: prompts/runtime/00_developer.txt
  reasoning_effort: medium
  max_completion_tokens: 4096
  temperature: null
  tool_choice: auto
  parallel_tool_calls: false
  max_requests_per_run: 12
  report_request_reserve: 1
  live_access_verified: false
  proposed_model_from_v1: muse-spark-1.3
  proposed_base_url_from_v1: https://api.meta.ai/v1
  provider_contract_verified: false
science:
  baseline_model_family: esm2_t30_150M_UR50D
  baseline_checkpoint_revision: null
  baseline_scoring_strategy: masked_marginals
  rank_policy: esm150_masked_v1
  max_sequence_length: 512
  max_candidates: 200
  max_top_k: 20
  candidate_seed: 42
  # Provisioned 2026-10-28 with pinned public weights. The offered model choice is
  # derived from the configured checkpoint pins, so an unprovisioned checkpoint is
  # never offered. One run still keeps one checkpoint; the verifier never reranks.
  verifier_enabled: true
  verifier_model_family: esm2_t33_650M_UR50D
  max_verifier_positions: 24
  fold_enabled: false
  max_structure_predictions: 0
  target_profile: reference/target_profile.json
  residue_map: reference/residue_map.json
  reference_numbering: full_reference_1based
  baseline_sequence_context: full_212
  default_objective_profile_id: lipase_T50_hypothesis_review
  phenotype_calibrated: false
  coordinate_features_enabled: false
  biological_validation_status: not_run
  baseline_review_before_ui: true
  protected_positions:
  - 108
  - 164
  - 187
atlas:
  # One actual exact-WT response was sanitized and pinned on 2026-10-28.
  # The product tool reads this snapshot; it never calls the live API or folds.
  source_mode: imported_snapshot
  live_search_endpoint: null
  api_base_url: null
  max_hits: 100
  source_manifest: reference/atlas_snapshot_policy.json
  live_endpoint_verified: false
  provider: biohub_esm_atlas
  provider_status: pinned_exact_wt_snapshot_available
  provider_status_evidence: reference/atlas_registered_reference_20261028.json; HTTP 200; fold_on_miss=false; raw response SHA256 recorded
  optional_context_only: true
  alternative_provider: meta_esm_atlas_2023
  alternative_provider_status: upstream_archived_2024_08_01
  alternative_provider_evidence: facebookresearch/esm archived read-only 2024-08-01; legacy route is separate from current Biohub Atlas
  alternative_provider_enabled: false
  not_enabled_reason: Live search, compute-on-miss, and structure fetch remain disabled; only the pinned sanitized exact-WT snapshot is offered. Biohub is not the Meta model provider.
budget:
  proposed_usd_micros_per_run: 2000000
  max_gpu_seconds_per_run: 900
  concurrent_gpu_jobs: 1
  approved_budget_version: null
  provider_credit_verified: false
runtime:
  durable_storage_required: true
  worker_count: 1
  max_transient_read_retries: 2
  max_schema_repair_attempts: 1
  report_fallback: deterministic_partial
  arbitrary_shell_tools: false
  arbitrary_url_tools: false
  label_directory_mounted: false
  runtime_bundle_policy: whitelist_only
  evaluator_directory_mounted: false
  bundle_allowlist: config/runtime_bundle.allowlist.json
  native_host_filesystem_isolation_verified: false
  outcome_material_allowed: false
evaluation:
  raw_data_reconciled: false
  actual_measurements_present: false
  wt_improvement_metric_enabled: false
  assay_protocol: evaluation_private/assay_protocol.json
  reconciliation: evaluation_private/dataset_reconciliation.json
  final_test_frozen: false
product:
  track: Indie Developer
  theme: Push the Frontier
  primary_mode: controlled_meta_host_mcp
  native_host_candidate: muse_code
  native_host_verified: false
  viewer: streamlit_optional
  hosted_website_required_by_this_plan: false
  installer_required_by_this_plan: false
  submission_format_recheck_required: true
mcp:
  enabled: false
  server_implemented: false
  transport: stdio
  remote_enabled: false
  catalog: schemas/tools.mcp.json
  sdk_version: null
  protocol_version: null
  compatibility_verified: false
  session_binding: trusted_launcher_only
  server_side_guards_required: true
  arbitrary_resources_enabled: false
  evaluator_tools_enabled: false
  max_tool_calls_per_run: 12
